<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Sengoku no Jidai</title>
    <script>
      // SPA fallback pour GitHub Pages : conserve le chemin demandé et
      // redirige vers l'app, qui restaurera la route via React Router.
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem("snj_redirect", path);
        var segments = window.location.pathname.split("/");
        // Conserve le base path éventuel (ex: /SnJGenerator/) si présent.
        var base = segments.length > 2 ? "/" + segments[1] + "/" : "/";
        window.location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
