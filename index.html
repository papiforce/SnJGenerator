<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sengoku no Jidai — Générateur de Fiches</title>
    <meta
      name="description"
      content="Créez, personnalisez et exportez vos fiches de personnage pour le forum Sengoku no Jidai."
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function (l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) +
            (decoded[0].slice(2) || '/') +
            (decoded[1] ? '?' + decoded[1].slice(2) : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
